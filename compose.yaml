services:
  gosingbox:
    container_name: gosingbox
    hostname: gosingbox
    image: rwnode/gosingbox:latest
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=""

